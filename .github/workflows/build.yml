name: Test and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-15
          - platform: android
            os: ubuntu-24.04
          - platform: ios
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Windows
        if: matrix.platform == 'windows'
        run: |
          flutter build windows --release
          Copy-Item packaging/windows/register.ps1 build/windows/x64/runner/Release/
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath sutoriraita-windows.zip
      - name: Build Linux
        if: matrix.platform == 'linux'
        run: |
          flutter build linux --release
          cp packaging/linux/* build/linux/x64/release/bundle/
          chmod +x build/linux/x64/release/bundle/install.sh
          tar -czf sutoriraita-linux.tar.gz -C build/linux/x64/release/bundle .
      - name: Build macOS (unsigned)
        if: matrix.platform == 'macos'
        run: |
          flutter build macos --release
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/sutoriraita.app sutoriraita-macos.zip
      - name: Build Android (development signing)
        if: matrix.platform == 'android'
        run: flutter build apk --release
      - name: Build iOS (unsigned, no provisioning required)
        if: matrix.platform == 'ios'
        run: |
          flutter build ios --release --no-codesign
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app sutoriraita-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sutoriraita-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            sutoriraita-*.zip
            sutoriraita-*.tar.gz
            build/app/outputs/flutter-apk/app-release.apk
